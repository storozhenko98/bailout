[package]
name = "bailout"
version = "0.7.3"
edition = "2021"
description = "The harness meant to be deleted. Bootstrap fresh machines and repair broken coding tools."
license = "MIT"
repository = "https://github.com/storozhenko98/bailout"
rust-version = "1.85"

[dependencies]
serde_json = "1.0"
libc = "0.2"
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
