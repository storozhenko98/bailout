name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            name: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target ${{ matrix.target }} && cargo build --release --locked --target ${{ matrix.target }}
      - run: python3 scripts/check-size.py target/${{ matrix.target }}/release/bailout
      - run: python3 scripts/smoke.py target/${{ matrix.target }}/release/bailout
      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bailout dist/bailout
          tar -czf bailout-${{ matrix.name }}.tar.gz -C dist bailout
      - uses: actions/upload-artifact@v4
        with:
          name: bailout-${{ matrix.name }}
          path: bailout-${{ matrix.name }}.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bailout-*
          merge-multiple: true
          path: dist
      - run: sha256sum bailout-*.tar.gz > SHA256SUMS
        working-directory: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "bailout $GITHUB_REF_NAME" --notes-file RELEASE.md
        env:
          GH_TOKEN: ${{ github.token }}
