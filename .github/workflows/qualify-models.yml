name: qualify free models
on:
  workflow_call:
    inputs:
      models:
        type: string
        default: ''
      progress_group:
        type: string
        default: 'nightly'
      diagnose_task:
        type: string
        default: ''
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      progress_group:
        description: 'Checkpoint group to resume (independent provider jobs can run concurrently).'
        type: string
        default: nightly
      models:
        description: 'Optional: up to two exact candidate IDs, separated by spaces. Blank uses nightly rotation.'
        type: string
        default: ''
      diagnose_task:
        description: 'Optional synthetic task to diagnose; no rankings or checkpoints are published.'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: model-qualification-${{ inputs.progress_group || 'nightly' }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      rankings: ${{ steps.results.outputs.rankings }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated harness
        run: docker build -t bailout-evaluation:local -f bench/Dockerfile .
      - name: Verify benchmark fixtures and isolation
        run: BAILOUT_TEST_DOCKER=1 python3 bench/test_bench.py
      - uses: actions/cache/restore@v4
        if: inputs.diagnose_task == ''
        with:
          path: artifacts/qualification-progress.json
          key: qualification-v2:${{ inputs.progress_group || 'nightly' }}:${{ hashFiles('src/**', 'bench/**') }}:${{ github.run_id }}:${{ github.run_attempt }}
          restore-keys: |
            qualification-v2:${{ inputs.progress_group || 'nightly' }}:${{ hashFiles('src/**', 'bench/**') }}:
            qualification-v2:${{ inputs.progress_group || 'nightly' }}:
            qualification-${{ inputs.progress_group || 'nightly' }}-${{ hashFiles('src/**', 'bench/**') }}-
      - name: Evaluate synthetic setup and repair tasks
        id: evaluation
        continue-on-error: true
        env:
          BAILOUT_BENCHMARK_TOKEN: ${{ secrets.BAILOUT_BENCHMARK_TOKEN }}
          BAILOUT_EVAL_MODELS: ${{ inputs.models }}
          BAILOUT_DIAGNOSE_TASK: ${{ inputs.diagnose_task }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          models = os.environ.get('BAILOUT_EVAL_MODELS', '').split()
          if len(models) > 2 or any(not re.fullmatch(r'[\w.-]+/(?:[\w.-]+/)*[\w.-]+:free', m) for m in models):
              raise SystemExit('Use at most two exact free candidate IDs')
          args = ['python3', 'bench/run.py', '--skip-build', '--max-models', '2', '--max-requests', '160', '--checkpoint', 'artifacts/qualification-progress.json']
          diagnostic = os.environ.get('BAILOUT_DIAGNOSE_TASK', '')
          if diagnostic:
              args += ['--diagnose-task', diagnostic]
          subprocess.run(args + (['--models', *models] if models else []), check=True)
          PY
      - name: Preserve completed evidence
        id: results
        if: always()
        run: |
          if test -f artifacts/rankings.json; then
            echo 'rankings=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-qualification-${{ inputs.progress_group || 'nightly' }}
          path: |
            artifacts/rankings.json
            artifacts/qualification-report.json
            artifacts/qualification-progress.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always() && inputs.diagnose_task == '' && hashFiles('artifacts/qualification-progress.json') != ''
        with:
          path: artifacts/qualification-progress.json
          key: qualification-v2:${{ inputs.progress_group || 'nightly' }}:${{ hashFiles('src/**', 'bench/**') }}:${{ github.run_id }}:${{ github.run_attempt }}
      - name: Report incomplete evaluation
        if: steps.evaluation.outcome == 'failure'
        run: exit 1
  publish:
    needs: evaluate
    if: always() && needs.evaluate.outputs.rankings == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model-qualification-${{ inputs.progress_group || 'nightly' }}
      - name: Publish validated ranking atomically
        env:
          BAILOUT_RANKING_PUBLISH_TOKEN: ${{ secrets.BAILOUT_RANKING_PUBLISH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          token = os.environ['BAILOUT_RANKING_PUBLISH_TOKEN']
          if len(token) < 32:
              raise SystemExit('Ranking publication secret is not configured')
          request = urllib.request.Request('https://api.bailout.dev/internal/rankings',
              data=pathlib.Path('rankings.json').read_bytes(),
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json',
                       'User-Agent': 'bailout-qualification/1.0 (+https://bailout.dev)'})
          with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
              print('Ranking published:', response.status)
          PY
